site_name: Little Squeaky Machine
repo_url: https://github.com/littleweirdo-studio/little-squeaky-machine-hardware
theme: 
  name: material
  font:
    code: Roboto mono
  features:
    - navigation.instant
    - content.code.annotate
  repo: fontawesome/brands/github
nav:
  - Start: index.md
  - Specs: specs.md
  - Pinout: pinout.md
  - I²C device addresses: address.md
  - Firmware: firmware.md
extra:
  version:
    default: stable 
    provider: mike
extra_css:
  - css/custom.css
plugins:
  - search
  - glightbox:
       touchNavigation: true
       loop: false
       effect: zoom
       slide_effect: slide
       width: 100%
       height: auto
       zoomable: true
       draggable: true
       skip_classes:
         - custom-skip-class-name
       auto_themed: false
       auto_caption: false
       caption_position: bottom
       background: white
       shadow: true
       manual: false
 # - to-pdf
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
