site_name: Little Squeaky Machine
theme: 
  name: material
  font:
    code: Roboto mono
  features:
    - navigation.instant
    - content.code.annotate
nav:
  - Start: index.md
  - Specs: specs.md
  - Pinout: pinout.md
  - I²C device addresses: address.md
extra_css:
  - css/custom.css
plugins:
  - to-pdf
markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - attr_list